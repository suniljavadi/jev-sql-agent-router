services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jev_agent}
      POSTGRES_USER: ${POSTGRES_USER:-jev_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    build: .
    image: jev-sql-agent-router:local
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jev_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jev_agent}
      JEV_PROVIDER: ${JEV_PROVIDER:-mock}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:?Set REVIEWER_API_KEY in .env}
      AUTO_EXECUTE_THRESHOLD: ${AUTO_EXECUTE_THRESHOLD:-0.90}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.70}
      ALLOW_DESTRUCTIVE_SQL: ${ALLOW_DESTRUCTIVE_SQL:-false}
      SQL_ALLOWED_TABLES: ${SQL_ALLOWED_TABLES:-customers}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-5}
      EXTERNAL_TIMEOUT_SECONDS: ${EXTERNAL_TIMEOUT_SECONDS:-10}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      MAX_ROWS: ${MAX_ROWS:-100}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - egress

  ui:
    build: .
    image: jev-sql-agent-router:local
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000
      STREAMLIT_CONFIG_DIR: /tmp/streamlit
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
  egress: